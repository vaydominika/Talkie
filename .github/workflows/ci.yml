name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talkie
          POSTGRES_PASSWORD: talkie
          POSTGRES_DB: talkie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talkie -d talkie_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://talkie:talkie@localhost:5432/talkie_test
      TEST_DATABASE_URL: postgresql://talkie:talkie@localhost:5432/talkie_test
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
